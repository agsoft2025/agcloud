version: "3.9"

services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"

  livekit:
    image: livekit/livekit-server
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes:
      - ./infrastructure/livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881/udp"
      - "50000-50010:50000-50010/udp"
    depends_on:
      - mongo
      - redis

  agcloud-api:
    build:
      context: ./agcloud-api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/agcloud
      - REDIS_URL=redis://redis:6379
      - LIVEKIT_API_KEY=local
      - LIVEKIT_API_SECRET=local_secret
      - LIVEKIT_URL=http://livekit:7880
      - JWT_SECRET=dev-secret-change-for-production-use-only
    ports:
      - "3000:3000"
    depends_on:
      - mongo
      - redis
      - livekit
    volumes:
      - ./agcloud-api:/app

  # Web frontend is maintained in a separate repo: https://github.com/agsoft2025/agcloudfrontend
  # Run it independently with: cd ../agcloudfrontend && pnpm dev

volumes:
  mongo-data:
