version: "3.9"

services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"

  livekit:
    image: livekit/livekit-server
    restart: unless-stopped
    environment:
      - LIVEKIT_REDIS_URL=redis://redis:6379
      - LIVEKIT_DB_URL=mongodb://mongo:27017/livekit
      - LIVEKIT_API_KEY=local
      - LIVEKIT_API_SECRET=local_secret
      - LIVEKIT_SIGNAL_PORT=7880
      - LIVEKIT_HTTP_PORT=7880
      - LIVEKIT_UDP_PORT=7881
      - LIVEKIT_UDP_PORT_RANGE=50000-60000
    ports:
      - "7880:7880"
      - "7881:7881/udp"
      - "50000-50010:50000-50010/udp"
    depends_on:
      - mongo
      - redis

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/agcloud
      - REDIS_URL=redis://redis:6379
      - LIVEKIT_API_KEY=local
      - LIVEKIT_API_SECRET=local_secret
      - LIVEKIT_URL=http://livekit:7880
      - JWT_SECRET=dev-secret
    ports:
      - "3000:3000"
    depends_on:
      - mongo
      - redis
      - livekit
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - VITE_API_BASE_URL=http://localhost:3000
      - VITE_LIVEKIT_URL=ws://localhost:7880
    ports:
      - "4173:4173"
    volumes:
      - ./frontend:/app
    command: ["pnpm", "dev", "--host", "0.0.0.0", "--port", "4173"]
    depends_on:
      - backend

volumes:
  mongo-data:
