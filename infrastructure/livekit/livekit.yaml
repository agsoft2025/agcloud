# LiveKit server configuration for agcloud

# Basic example values. Replace with your environment-specific settings.

rtc:
  port: 7880
  tls:
    cert: /etc/livekit/cert.pem
    key: /etc/livekit/key.pem

api:
  port: 7880

signal:
  port: 7880

turn:
  # LiveKit can serve TURN on port 443 for firewall-friendly fallback.
  host: 0.0.0.0
  port: 443
  tls:
    cert: /etc/livekit/cert.pem
    key: /etc/livekit/key.pem

redis:
  url: redis://redis:6379

database:
  url: mongodb://mongo:27017/livekit

auth:
  api_key: "YOUR_LIVEKIT_API_KEY"
  api_secret: "YOUR_LIVEKIT_API_SECRET"

logging:
  level: info

# Optional: egress storage settings for recordings
# egress:
#   enabled: true
#   provider: s3
#   s3:
#     bucket: agcloud-recordings
#     region: us-east-1
#     access_key: YOUR_ACCESS_KEY
#     secret_key: YOUR_SECRET_KEY
