port: 7880

rtc:
  udp_port: 7881
  port_range_start: 50000
  port_range_end: 50010
  use_external_ip: false  # false for Docker Desktop on Windows/Mac (VM networking)

keys:
  local: local_secret  # format: apiKey: apiSecret

redis:
  address: redis:6379

webhook:
  urls:
    - http://agcloud-api:3000/api/webhooks/livekit
  api_key: local

logging:
  level: info

# TURN and TLS not required for local dev.
# Uncomment for production:
# turn:
#   enabled: true
#   domain: livekit.yourdomain.com
#   tls_port: 5349
#   udp_port: 3478
#   external_tls: true
